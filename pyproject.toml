[project]
name = "aireceptionist"
version = "0.1.0"
description = "AI voice receptionist backend for an HVAC company, built on Retell AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "retell-sdk>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.149",
    "google-auth>=2.35",
    "google-auth-httplib2>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
