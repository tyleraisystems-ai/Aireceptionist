<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Aireceptionist — Web Call Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 1rem; padding: 8px 16px; margin-right: 8px; }
  #status { font-weight: bold; margin: 12px 0; }
  #transcript { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: 12px; min-height: 200px; }
</style>
</head>
<body>
<h1>Aireceptionist — Web Call Test</h1>
<p>
  Generated by <code>python -m scripts.create_web_call</code>. Requires microphone
  permission. The access token is read from the <code>?token=</code> query param.
</p>
<button id="start">Start Call</button>
<button id="stop">End Call</button>
<div id="status">idle</div>
<div id="transcript"></div>

<script src="https://unpkg.com/retell-client-js-sdk@latest/dist/index.umd.js"></script>
<script>
  const statusEl = document.getElementById("status");
  const transcriptEl = document.getElementById("transcript");
  const token = new URLSearchParams(window.location.search).get("token");

  if (!token) {
    statusEl.textContent = "no token provided — open this page with ?token=<access_token>";
  }

  const client = new RetellWebClient.RetellWebClient();

  client.on("call_started", () => (statusEl.textContent = "call started"));
  client.on("call_ended", () => (statusEl.textContent = "call ended"));
  client.on("error", (error) => {
    statusEl.textContent = "error: " + error;
    client.stopCall();
  });
  client.on("update", (update) => {
    if (update.transcript) {
      transcriptEl.textContent = update.transcript
        .map((turn) => `${turn.role}: ${turn.content}`)
        .join("\n");
    }
  });

  document.getElementById("start").addEventListener("click", () => {
    if (!token) return;
    statusEl.textContent = "connecting...";
    client.startCall({ accessToken: token });
  });

  document.getElementById("stop").addEventListener("click", () => {
    client.stopCall();
  });
</script>
</body>
</html>
